[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coevo"
version = "0.1.0"
description = "Local agent adaptation and parameter learning"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=1.33.0",
    "openai>=3.29.0",
    "peft>=0.21.2",
    "vllm>=0.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coevo"]
