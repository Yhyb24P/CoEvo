name: CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standard-library contracts
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Pi adapter syntax
        run: node --check scripts/pi-project-agent.mjs
      - name: Whitespace
        run: git diff --check
